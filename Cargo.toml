[package]
name = "alice-queue"
version = "0.2.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Deterministic Zero-Copy Message Log - Optimized Edition"
license = "AGPL-3.0 OR LicenseRef-Commercial"
repository = "https://github.com/ext-sakamoro/ALICE-Queue"
keywords = ["queue", "ringbuffer", "wal", "lock-free", "message-log"]
publish = false

[features]
default = ["std"]
std = []
crypto = ["dep:alice-crypto", "std"]  # ALICE-Crypto message encryption
text = ["dep:alice-text", "std"]  # ALICE-Text compressed log payloads

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
memmap2 = "0.9"
blake3 = "1.5"
alice-crypto = { path = "../ALICE-Crypto", optional = true, default-features = false, features = ["std"] }
alice-text = { path = "../ALICE-Text", optional = true, default-features = false }
alice-sign = { version = "0.1", git = "https://github.com/ext-sakamoro/ALICE-Sign", rev = "6b79a0bad3db4c7de1719251d6a2a9405fbc0ee2" }

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
