name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # alice-blockchain は **実 clone** する (stub にしない)
      # src が signature::{KeyPair, PublicKey, Signature} を無条件に使い、
      # tampered_*_breaks_verify 系の test が実 Ed25519 の検証に依存している
      # fake を置くと「暗号的に無効な test double」で CI が緑になる
      # (canonical 罠 #21、ALICE-Audit が 2026-09-15 に rich stub を廃止したのと同じ判断)
      # ALICE-Blockchain は private repo なので read-only deploy key で SSH clone する
      - name: Setup SSH for ALICE-Blockchain (private sibling)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALICE_BLOCKCHAIN_DEPLOY_KEY }}
      - name: Clone ALICE-Blockchain (real sibling)
        run: git clone --depth 1 git@github.com:ext-sakamoro/ALICE-Blockchain.git ../ALICE-Blockchain
      - name: Create dependency stubs
        run: |
          for crate_info in \
            "ALICE-Crypto:alice-crypto" \
            "ALICE-Text:alice-text"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --tests

  test-all-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # alice-blockchain は **実 clone** する (stub にしない)
      # src が signature::{KeyPair, PublicKey, Signature} を無条件に使い、
      # tampered_*_breaks_verify 系の test が実 Ed25519 の検証に依存している
      # fake を置くと「暗号的に無効な test double」で CI が緑になる
      # (canonical 罠 #21、ALICE-Audit が 2026-09-15 に rich stub を廃止したのと同じ判断)
      # ALICE-Blockchain は private repo なので read-only deploy key で SSH clone する
      - name: Setup SSH for ALICE-Blockchain (private sibling)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALICE_BLOCKCHAIN_DEPLOY_KEY }}
      - name: Clone ALICE-Blockchain (real sibling)
        run: git clone --depth 1 git@github.com:ext-sakamoro/ALICE-Blockchain.git ../ALICE-Blockchain
      - name: Create dependency stubs
        run: |
          for crate_info in \
            "ALICE-Crypto:alice-crypto" \
            "ALICE-Text:alice-text"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --tests --all-features
        continue-on-error: true

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # alice-blockchain は **実 clone** する (stub にしない)
      # src が signature::{KeyPair, PublicKey, Signature} を無条件に使い、
      # tampered_*_breaks_verify 系の test が実 Ed25519 の検証に依存している
      # fake を置くと「暗号的に無効な test double」で CI が緑になる
      # (canonical 罠 #21、ALICE-Audit が 2026-09-15 に rich stub を廃止したのと同じ判断)
      # ALICE-Blockchain は private repo なので read-only deploy key で SSH clone する
      - name: Setup SSH for ALICE-Blockchain (private sibling)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALICE_BLOCKCHAIN_DEPLOY_KEY }}
      - name: Clone ALICE-Blockchain (real sibling)
        run: git clone --depth 1 git@github.com:ext-sakamoro/ALICE-Blockchain.git ../ALICE-Blockchain
      - name: Create dependency stubs
        run: |
          for crate_info in \
            "ALICE-Crypto:alice-crypto" \
            "ALICE-Text:alice-text"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --lib --tests -- -W clippy::all -W clippy::pedantic

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # alice-blockchain は **実 clone** する (stub にしない)
      # src が signature::{KeyPair, PublicKey, Signature} を無条件に使い、
      # tampered_*_breaks_verify 系の test が実 Ed25519 の検証に依存している
      # fake を置くと「暗号的に無効な test double」で CI が緑になる
      # (canonical 罠 #21、ALICE-Audit が 2026-09-15 に rich stub を廃止したのと同じ判断)
      # ALICE-Blockchain は private repo なので read-only deploy key で SSH clone する
      - name: Setup SSH for ALICE-Blockchain (private sibling)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALICE_BLOCKCHAIN_DEPLOY_KEY }}
      - name: Clone ALICE-Blockchain (real sibling)
        run: git clone --depth 1 git@github.com:ext-sakamoro/ALICE-Blockchain.git ../ALICE-Blockchain
      - name: Create dependency stubs
        run: |
          for crate_info in \
            "ALICE-Crypto:alice-crypto" \
            "ALICE-Text:alice-text"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "../$dir/src"
            cat > "../$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          TOML
            echo "" > "../$dir/src/lib.rs"
          done
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
